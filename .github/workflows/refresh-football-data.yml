name: Refresh football feeds
on:
  push:
    branches: [main]
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: matchday-football-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Cache approved ESPN responses for browser fallback
        id: refresh_espn
        continue-on-error: true
        run: python3 refresh_espn.py
      - name: Refresh approved football RSS feeds
        id: refresh_news
        continue-on-error: true
        run: python3 refresh_news.py
      - name: Fetch changed score data
        id: refresh_scores
        continue-on-error: true
        run: python3 update_scores.py
      - name: Publish changed snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh football feed snapshots"
            git push origin HEAD:main
          else
            echo "No published data changes."
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent || echo "Pages rebuild deferred; the next refresh can retry."
      - name: Surface data refresh failures
        if: always()
        env:
          ESPN_OUTCOME: ${{ steps.refresh_espn.outcome }}
          NEWS_OUTCOME: ${{ steps.refresh_news.outcome }}
          SCORES_OUTCOME: ${{ steps.refresh_scores.outcome }}
        run: |
          failed=0
          if [ "$ESPN_OUTCOME" != "success" ]; then
            echo "::error::ESPN refresh did not complete cleanly (outcome: $ESPN_OUTCOME)."
            failed=1
          fi
          if [ "$NEWS_OUTCOME" != "success" ]; then
            echo "::error::Football news refresh did not complete cleanly (outcome: $NEWS_OUTCOME)."
            failed=1
          fi
          if [ "$SCORES_OUTCOME" != "success" ]; then
            echo "::error::OpenLigaDB score refresh did not complete cleanly (outcome: $SCORES_OUTCOME)."
            failed=1
          fi
          exit "$failed"
