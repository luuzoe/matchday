name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run JavaScript tests
        run: node --test *.test.cjs
      - name: Run Python refresh tests
        run: |
          python3 refresh_espn.test.py
          python3 refresh_news.test.py
          python3 update_scores.test.py
